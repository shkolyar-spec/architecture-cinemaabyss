name: API Tests

on:
  push:
    branches: [ cinema ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: "docker"
        type: choice
        options:
          - docker
          - local

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run tests (docker)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'docker' }}
        working-directory: tests/postman
        run: |
          docker compose up -d --build
          echo "Waiting for services..."
          sleep 20
          node run-tests.js --environment ci

      - name: Run tests (local)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'local' }}
        working-directory: tests/postman
        run: npm run test:local

      - name: Stop services
        if: always()
        run: docker compose down -v
