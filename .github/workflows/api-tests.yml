name: API Tests

on:
  push:
    branches: [ cinema ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run tests against"
        required: true
        default: "docker"
        type: choice
        options:
          - docker
          - local

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        working-directory: tests/postman
        run: npm ci

      - name: Run tests against docker-compose
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.environment == 'docker' }}
        working-directory: tests/postman
        run: |
          docker compose up -d --build

          echo "Waiting for services to be ready..."
          # Отключаем прокси, иначе newman может падать с "Invalid IP address: undefined"
          export HTTP_PROXY=""
          export HTTPS_PROXY=""
          export ALL_PROXY=""
          export NO_PROXY="localhost,127.0.0.1"

          # Подождём readiness через health endpoints
          for i in {1..60}; do
            curl -fsS http://localhost:8080/health && break || true
            sleep 2
          done
          for i in {1..60}; do
            curl -fsS http://localhost:8081/api/movies/health && break || true
            sleep 2
          done
          for i in {1..60}; do
            curl -fsS http://localhost:8082/api/events/health && break || true
            sleep 2
          done
          for i in {1..60}; do
            curl -fsS http://localhost:8000/health && break || true
            sleep 2
          done

          # Запускаем local (потому что тесты идут с хоста GitHub Runner)
          npm run test:local

      - name: Stop services
        if: always()
        run: docker compose down -v
