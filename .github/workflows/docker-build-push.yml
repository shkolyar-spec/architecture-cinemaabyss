name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Monolith image
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/monolith:latest

      - name: Build and push Movies Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/movies-service:latest

      - name: Build and push Events Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/events-service:latest

      - name: Build and push Proxy Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/proxy-service:latest
