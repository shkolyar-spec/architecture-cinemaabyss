name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [ main, cinema ]
    paths:
      - "src/**"
      - ".github/workflows/docker-build-push.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build stack for tests
        run: docker compose up -d --build

      - name: Run Postman tests (docker)
        working-directory: tests/postman
        run: |
          npm ci
          npm run test:docker

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Build and push Events Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/events-service:latest

      - name: Build and push Proxy Service image
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/proxy-service:latest
