# Global settings
global:
  namespace: cinemaabyss
  domain: cinemaabyss.example.com

# Image pull secrets (base64 of ~/.docker/config.json for ghcr.io)
imagePullSecrets:
  dockerconfigjson: ""

# PostgreSQL
database:
  host: postgres
  port: 5432
  name: cinemaabyss
  user: postgres
  # base64("postgres_password") for secret template usage
  password: cG9zdGdyZXNfcGFzc3dvcmQ=
  image:
    repository: postgres
    tag: "14"
    pullPolicy: IfNotPresent

# Kafka (values used by templates/kafka/*)
kafka:
  enabled: true

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: cinemaabyss.example.com
      paths:
        - path: /
          pathType: Prefix
          service: proxy-service
          port: 80
        - path: /api/events
          pathType: Prefix
          service: events-service
          port: 8082

# Application configuration (Strangler Fig)
config:
  gradualMigration: "true"
  moviesMigrationPercent: "100"

# Services
monolith:
  enabled: true
  image:
    repository: ghcr.io/shkolyar-spec/architecture-cinemaabyss/monolith
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    port: 8080
    targetPort: 8080
  resources: {}

moviesService:
  enabled: true
  image:
    repository: ghcr.io/shkolyar-spec/architecture-cinemaabyss/movies-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    port: 8081
    targetPort: 8081
  resources: {}

eventsService:
  enabled: true
  image:
    repository: ghcr.io/shkolyar-spec/architecture-cinemaabyss/events-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    port: 8082
    targetPort: 8082
  resources: {}

proxyService:
  enabled: true
  image:
    repository: ghcr.io/shkolyar-spec/architecture-cinemaabyss/proxy-service
    tag: latest
    pullPolicy: Always
  replicas: 1
  service:
    port: 80
    targetPort: 8000
  resources: {}
